name: Update Subscriptions

on:
  schedule:
    # 每 4 小时自动更新一次（UTC）
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持手动点击运行

concurrency:
  group: proxy-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 测活出口：Secret 优先。支持 TEST_RELAY_NODE / _2 / _3。
          # 可直接粘贴 vless/vmess/trojan/ss/hysteria2/tuic/anytls URI，或 Base64 单节点。
          TEST_RELAY_NODE: ${{ secrets.TEST_RELAY_NODE }}
          TEST_RELAY_NODE_2: ${{ secrets.TEST_RELAY_NODE_2 }}
          TEST_RELAY_NODE_3: ${{ secrets.TEST_RELAY_NODE_3 }}
          # 便于日志/网络请求正常运行
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
            output/run_report.json
            output/summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('output/summary.json')
          print('## 本轮节点更新摘要')
          if not p.exists():
              print('未生成 summary.json，可能本轮在测活阶段提前退出；请查看上方日志。')
          else:
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
                  print(f"- 总节点：**{d.get('total', 0)}**")
                  print(f"- 家宽：**{d.get('residential', 0)}**")
                  print(f"- 非家宽低欺诈原生 IP：**{d.get('non_residential', 0)}**")
                  print(f"- 家宽五星：**{d.get('residential_stars', {}).get('5', 0)}**")
                  print(f"- 家宽四星：**{d.get('residential_stars', {}).get('4', 0)}**")
                  print(f"- 家宽三星：**{d.get('residential_stars', {}).get('3', 0)}**")
              except Exception as e:
                  print(f'读取 summary.json 失败：{e}')
          PY

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # residential-pool.json 是持久化的五星家宽资产，必须随每轮结果提交回仓库。
          # 同时提交全部 output/，保证订阅和历史池保持同步。
          git add -A output/ README.md

          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
            exit 0
          fi

          git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

          # 避免手动运行与定时运行同时 push 时因远端已有新提交而失败。
          # 最多重试 3 次，每次先拉取远端并 rebase。
          for attempt in 1 2 3; do
            if git push; then
              echo "结果已成功提交到仓库。五星家宽池已持久化。"
              exit 0
            fi
            echo "Push 第 ${attempt} 次失败，尝试同步远端后重试..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

          echo "[ERROR] 连续 3 次 push 失败。"
          exit 1
