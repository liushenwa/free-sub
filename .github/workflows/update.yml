name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持手动点击运行

concurrency:
  group: proxy-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 测活出口：Secret 优先。支持 TEST_RELAY_NODE / _2 / _3。
          # 可直接粘贴 vless/vmess/trojan/ss/hysteria2/tuic/anytls URI，或 Base64 单节点。
          TEST_RELAY_NODE: ${{ secrets.TEST_RELAY_NODE }}
          TEST_RELAY_NODE_2: ${{ secrets.TEST_RELAY_NODE_2 }}
          TEST_RELAY_NODE_3: ${{ secrets.TEST_RELAY_NODE_3 }}
          # 便于日志/网络请求正常运行
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # residential-pool.json 是持久化的五星家宽资产，必须随每轮结果提交回仓库。
          # 同时提交全部 output/，保证订阅和历史池保持同步。
          git add -A output/ README.md

          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
            exit 0
          fi

          git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

          # 避免手动运行与定时运行同时 push 时因远端已有新提交而失败。
          # 最多重试 3 次，每次先拉取远端并 rebase。
          for attempt in 1 2 3; do
            if git push; then
              echo "结果已成功提交到仓库。五星家宽池已持久化。"
              exit 0
            fi
            echo "Push 第 ${attempt} 次失败，尝试同步远端后重试..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

          echo "[ERROR] 连续 3 次 push 失败。"
          exit 1
